name: SahyogSetu CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Hardening
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Regression Test Suites (Phases 2-9)
        run: |
          python backend/tests/test_phase2_backend.py
          python backend/tests/test_phase3_ingestion.py
          python backend/tests/test_phase4_rag.py
          python backend/tests/test_phase5_bhashini.py
          python backend/tests/test_phase6_ml.py
          python backend/tests/test_phase7_news.py
          python backend/tests/test_phase8_integration.py
          python backend/tests/test_phase9_security.py

      - name: Run Phase 10 Quality Benchmarks
        run: |
          python backend/evaluation/phase10/jurisdiction_eval.py
          python backend/evaluation/phase10/answer_quality_eval.py
          python backend/evaluation/phase10/performance_eval.py

      - name: Run Phase 11 Deployment & Backup Tests
        run: |
          python backend/tests/test_phase11_deployment.py

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validate TypeScript Types
        working-directory: ./frontend
        run: npx tsc -b

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sahyogsetu:latest
