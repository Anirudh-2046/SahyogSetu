version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahyogsetu-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost,http://localhost:80,https://sahyogsetu.gov.in
      - RATE_LIMIT_ENABLED=true
      - MAX_UPLOAD_SIZE_BYTES=15728640
      - DATABASE_PATH=/app/backend/data/news.db
      - TTS_CACHE_DIR=/app/backend/data/tts_cache
    volumes:
      - sahyogsetu_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sahyogsetu-net

  nginx:
    image: nginx:1.27-alpine
    container_name: sahyogsetu-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sahyogsetu.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sahyogsetu-net

volumes:
  sahyogsetu_data:
    driver: local

networks:
  sahyogsetu-net:
    driver: bridge
